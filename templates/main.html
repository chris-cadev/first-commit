<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>First Commit Finder</title>
    <script
      src="/static/htmx.min.js"
      integrity="sha384-ZBXiYtYQ6hJ2Y0ZNoYuI+Nq5MqWBr+chMrS/RkXpNzQCApHEhOt2aY8EJgqwHLkJ"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="/static/main.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%2210 0 100 100%22><text y=%22.90em%22 font-size=%2290%22>🔍</text></svg>"
    />
  </head>

  <body>
    <div class="card">
      <h2>🔍 First Commit Finder</h2>
      <p class="subtitle">
        Discover the very first commit of any GitHub, GitLab, or Bitbucket
      </p>

      <form
        id="lookup-form"
        hx-post="/first-commit"
        hx-target="#result"
        hx-swap="innerHTML"
        hx-indicator="#loading-indicator"
      >
        <div class="form-group">
          <label for="repo_url">Repository URL</label>
          <input
            name="repo_url"
            id="repo_url"
            type="text"
            placeholder="https://github.com/user/repo.git"
            required
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="form-buttons">
          <button type="submit" id="submit-btn">Find First Commit</button>
          <button type="reset" id="clear-btn">Clear</button>
        </div>
      </form>

      <div id="loading-indicator" role="status">
        <span class="spinner" aria-hidden="true"></span>
        Looking up the first commit on GitHub, GitLab, or Bitbucket...
        <button type="button" id="cancel-btn">Cancel</button>
      </div>

      <div id="result" role="status" aria-live="polite" tabindex="-1"></div>
    </div>

    <script src="/static/main.js"></script>
  </body>
</html>
